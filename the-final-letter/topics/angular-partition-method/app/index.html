<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zeta2 annular exploded technical drawing</title>
<style>
html,body{margin:0;height:100%;background:#0e1116;overflow:hidden}
svg#stage{display:block;width:100vw;height:100vh}
#hud{position:fixed;left:12px;top:10px;color:#9fb0c3;font:12px/1.5 ui-monospace,monospace;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Full-bleed stage: the artwork owns the whole frame (no 72ch document column) -->
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"
     preserveAspectRatio="xMidYMid meet" role="img" aria-label="zeta2 annular exploded technical drawing">
  <defs>
    <!-- One shared light direction for every face; gradients/filters belong here -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b24"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d2836" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0e1116" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
  <g id="world"></g>
</svg>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
