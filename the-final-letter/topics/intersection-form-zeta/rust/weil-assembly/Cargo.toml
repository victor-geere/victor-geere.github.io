[package]
name = "weil-assembly"
version = "0.1.0"
edition = "2021"
description = "Certified rational interval assembly of the 4x4 Gaussian Weil Gram matrix"
license = "MIT"

[dependencies]
rug = { version = "1.17", features = ["integer", "rational", "float"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
clap = { version = "4.3.24", features = ["derive"] }

[profile.release]
opt-level = 3
