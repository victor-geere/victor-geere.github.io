<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" style="max-width:900px;font-family:Georgia,serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker></defs><rect width="900" height="400" fill="#fdfdfb"/><text x="450.0" y="24" text-anchor="middle" font-size="15" fill="#17202a">Four readings of “generalise”, and how far each one goes</text>
<rect x="40" y="54" width="60" height="60" rx="6" fill="#1e6b3a"/>
<text x="70" y="92" text-anchor="middle" font-size="20" fill="#fff">L1</text>
<rect x="108" y="54" width="752" height="60" rx="6" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.4"/>
<text x="126" y="79" font-size="13.5" fill="#1e6b3a">generalise the STATEMENTS</text>
<text x="126" y="100" font-size="11.5" fill="#17202a">DONE — the 010 theorems are already ∀ f and ∀ Finset α</text>
<rect x="40" y="130" width="60" height="60" rx="6" fill="#8a5a14"/>
<text x="70" y="168" text-anchor="middle" font-size="20" fill="#fff">L2</text>
<rect x="108" y="130" width="752" height="60" rx="6" fill="#fdf9f0" stroke="#8a5a14" stroke-width="1.4"/>
<text x="126" y="155" font-size="13.5" fill="#8a5a14">generalise the INSTANTIATION</text>
<text x="126" y="176" font-size="11.5" fill="#17202a">PARTIAL — Dirichlet L: FE normalisation proved; two named lemmas missing</text>
<rect x="40" y="206" width="60" height="60" rx="6" fill="#1f4e79"/>
<text x="70" y="244" text-anchor="middle" font-size="20" fill="#fff">L3</text>
<rect x="108" y="206" width="752" height="60" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.4"/>
<text x="126" y="231" font-size="13.5" fill="#1f4e79">generalise the METHOD</text>
<text x="126" y="252" font-size="11.5" fill="#17202a">TRANSFERABLE — enclosure⇒sign⇒root; count squeeze; pointwise⇒locally uniform⇒Weierstrass</text>
<rect x="40" y="282" width="60" height="60" rx="6" fill="#8a1c1c"/>
<text x="70" y="320" text-anchor="middle" font-size="20" fill="#fff">L4</text>
<rect x="108" y="282" width="752" height="60" rx="6" fill="#fdf6f6" stroke="#8a1c1c" stroke-width="1.4"/>
<text x="126" y="307" font-size="13.5" fill="#8a1c1c">generalise to ALL zeros</text>
<text x="126" y="328" font-size="11.5" fill="#17202a">IMPOSSIBLE — that is RH, and no finite certificate reaches it</text>
</svg>