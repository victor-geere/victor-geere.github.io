<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" style="max-width:920px;font-family:Georgia,serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker></defs><rect width="920" height="470" fill="#fdfdfb"/><text x="460.0" y="24" text-anchor="middle" font-size="15" fill="#17202a">What is already general (green) and what every new instantiation must supply (amber)</text>
<text x="34" y="90" text-anchor="end" font-size="13.5" fill="#7a2e2e">Route A</text>
<rect x="40" y="52" width="320" height="69" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="200" y="70" text-anchor="middle" font-size="12" fill="#1e6b3a">theorem core — ALREADY GENERAL</text>
<text x="200" y="85" text-anchor="middle" font-size="11.5" fill="#17202a">exists_unique_root_of_sign_change</text>
<rect x="400" y="52" width="260" height="69" rx="5" fill="#fdf9f0" stroke="#8a5a14" stroke-width="1.5"/>
<text x="530" y="70" text-anchor="middle" font-size="12" fill="#8a5a14">instantiation — function-specific</text>
<text x="530" y="85" text-anchor="middle" font-size="11.5" fill="#17202a">an interval evaluator for f, f′</text>
<text x="530" y="99" text-anchor="middle" font-size="11.5" fill="#17202a">(sign of f at the ends,</text>
<text x="530" y="113" text-anchor="middle" font-size="11.5" fill="#17202a">a one-signed bound for f′)</text>
<line x1="380" y1="52" x2="394" y2="86" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="34" y="186" text-anchor="end" font-size="13.5" fill="#7a2e2e">Route B</text>
<rect x="40" y="147" width="320" height="69" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="200" y="165" text-anchor="middle" font-size="12" fill="#1e6b3a">theorem core — ALREADY GENERAL</text>
<text x="200" y="180" text-anchor="middle" font-size="11.5" fill="#17202a">turing_reduction   (any Finset α)</text>
<text x="200" y="194" text-anchor="middle" font-size="11.5" fill="#17202a">routeB_reduction_general   (∀ f)</text>
<rect x="400" y="147" width="260" height="69" rx="5" fill="#fdf9f0" stroke="#8a5a14" stroke-width="1.5"/>
<text x="530" y="165" text-anchor="middle" font-size="12" fill="#8a5a14">instantiation — function-specific</text>
<text x="530" y="180" text-anchor="middle" font-size="11.5" fill="#17202a">functional equation  f(1−s) = f(s)</text>
<text x="530" y="194" text-anchor="middle" font-size="11.5" fill="#17202a">reality  f(conj s) = conj(f s)</text>
<text x="530" y="208" text-anchor="middle" font-size="11.5" fill="#17202a">zero data + orders, logDeriv evaluator</text>
<line x1="380" y1="147" x2="394" y2="182" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="34" y="280" text-anchor="end" font-size="13.5" fill="#7a2e2e">Route C</text>
<rect x="40" y="242" width="320" height="69" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="200" y="260" text-anchor="middle" font-size="12" fill="#1e6b3a">theorem core — ALREADY GENERAL</text>
<text x="200" y="275" text-anchor="middle" font-size="11.5" fill="#17202a">validated_truncation_bound</text>
<text x="200" y="289" text-anchor="middle" font-size="11.5" fill="#17202a">(n‑tail form: §4)</text>
<rect x="400" y="242" width="260" height="69" rx="5" fill="#fdf9f0" stroke="#8a5a14" stroke-width="1.5"/>
<text x="530" y="260" text-anchor="middle" font-size="12" fill="#8a5a14">instantiation — function-specific</text>
<text x="530" y="275" text-anchor="middle" font-size="11.5" fill="#17202a">the explicit formula for the object</text>
<text x="530" y="289" text-anchor="middle" font-size="11.5" fill="#17202a">a bound per tail</text>
<text x="530" y="303" text-anchor="middle" font-size="11.5" fill="#17202a">(prime side needs an Euler product)</text>
<line x1="380" y1="242" x2="394" y2="276" stroke="#1f4e79" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="460" y="343" text-anchor="middle" font-size="11.5" fill="#5b6b7c">the green column is what the Lean already quantifies over; the amber column is the price of a new object</text>
</svg>