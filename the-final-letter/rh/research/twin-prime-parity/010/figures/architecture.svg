<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" style="max-width:900px;font-family:Georgia,serif"><rect width="900" height="470" fill="#fdfdfb"/><text x="450.0" y="26" text-anchor="middle" font-size="15" fill="#17202a">Proof architecture: from Mathlib’s pointwise product to the unconditional budget</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker></defs>
<rect x="120" y="48" width="300" height="46" rx="5" fill="#f7f9fb" stroke="#5b6b7c" stroke-width="1.5"/>
<text x="270" y="66" text-anchor="middle" font-size="11.5" fill="#17202a">Mathlib: GammaSeq(s,n) = nˢ n! / ∏(s+j)</text>
<rect x="120" y="122" width="300" height="46" rx="5" fill="#f7f9fb" stroke="#5b6b7c" stroke-width="1.5"/>
<text x="270" y="140" text-anchor="middle" font-size="11.5" fill="#17202a">Mathlib: pointwise  GammaSeq → Γ</text>
<rect x="120" y="196" width="300" height="46" rx="5" fill="#f7f9fb" stroke="#5b6b7c" stroke-width="1.5"/>
<text x="270" y="214" text-anchor="middle" font-size="11.5" fill="#17202a">Mathlib: Weierstrass — derivᵏ of a</text>
<text x="270" y="228" text-anchor="middle" font-size="11.5" fill="#17202a">locally uniform limit</text>
<rect x="120" y="270" width="300" height="46" rx="5" fill="#f7f9fb" stroke="#5b6b7c" stroke-width="1.5"/>
<text x="270" y="288" text-anchor="middle" font-size="11.5" fill="#17202a">Mathlib: Cauchy circle formula,</text>
<text x="270" y="302" text-anchor="middle" font-size="11.5" fill="#17202a">dominated convergence</text>
<rect x="520" y="122" width="330" height="60" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="685" y="140" text-anchor="middle" font-size="11.5" fill="#17202a">NEW  tendstoLocallyUniformlyOn_GammaSeq</text>
<text x="685" y="154" text-anchor="middle" font-size="11.5" fill="#17202a">GammaSeq → Γ locally uniformly on Re s &gt; 0</text>
<rect x="520" y="210" width="330" height="46" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="685" y="228" text-anchor="middle" font-size="11.5" fill="#17202a">NEW  logDeriv GammaSeq → logDeriv Γ</text>
<text x="685" y="242" text-anchor="middle" font-size="11.5" fill="#17202a">+ derivᵏ of both sides</text>
<rect x="520" y="284" width="330" height="60" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="685" y="302" text-anchor="middle" font-size="11.5" fill="#17202a">NEW  digamma_polygamma_series</text>
<text x="685" y="316" text-anchor="middle" font-size="11.5" fill="#17202a">ψ⁽ᵏ⁾(s) = (−1)ᵏ⁺¹ k! Σⱼ (s+j)⁻ᵏ⁻¹</text>
<rect x="520" y="372" width="330" height="46" rx="5" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="685" y="390" text-anchor="middle" font-size="11.5" fill="#17202a">NEW  ‖Ψ⁽ᵏ⁾(t)‖ ≤ psiSeriesBound k   (k ≥ 1)</text>
<line x1="420" y1="71" x2="519" y2="152" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="420" y1="145" x2="519" y2="152" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="420" y1="219" x2="519" y2="152" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="420" y1="293" x2="519" y2="152" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="685" y1="182" x2="685" y2="210" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="685" y1="256" x2="685" y2="284" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="685" y1="344" x2="685" y2="372" stroke="#1f4e79" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="120" y="372" width="300" height="46" rx="5" fill="#fdf6f6" stroke="#8a1c1c" stroke-width="1.5"/>
<text x="270" y="390" text-anchor="middle" font-size="11.5" fill="#17202a">k = 0: Σ(1/4+j)⁻¹ diverges → psiSeriesBound 0 = 0</text>
<text x="270" y="404" text-anchor="middle" font-size="11.5" fill="#17202a">replacement: norm_digamma_le</text>
<line x1="420" y1="395" x2="519" y2="395" stroke="#8a1c1c" stroke-width="1.6" marker-end="url(#a)"/>
<text x="685" y="448" text-anchor="middle" font-size="11" fill="#5b6b7c">the four grey boxes are Mathlib; the green boxes are the two new modules</text>
</svg>