<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" style="max-width:900px;font-family:Georgia,serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker></defs><rect width="900" height="400" fill="#fdfdfb"/><text x="450.0" y="24" text-anchor="middle" font-size="15" fill="#17202a">The three routes and what each one buys</text>
<rect x="40" y="60" width="250" height="110" rx="6" fill="#f4f8fc" stroke="#1f4e79" stroke-width="1.6"/>
<text x="165" y="82" text-anchor="middle" font-size="13.5" fill="#1f4e79">Route A &mdash; certificates</text>
<text x="165" y="102" text-anchor="middle" font-size="11.5" fill="#17202a">Z(a) &lt; 0 &lt; Z(b)  (enclosed)</text>
<text x="165" y="117" text-anchor="middle" font-size="11.5" fill="#17202a">Z&prime; one-signed (enclosed)</text>
<text x="165" y="132" text-anchor="middle" font-size="11.5" fill="#17202a">&rArr; unique simple zero</text>
<text x="165" y="147" text-anchor="middle" font-size="11.5" fill="#17202a">on the critical line</text>
<rect x="330" y="60" width="250" height="110" rx="6" fill="#f6fbf7" stroke="#1e6b3a" stroke-width="1.6"/>
<text x="455" y="82" text-anchor="middle" font-size="13.5" fill="#1e6b3a">Route B &mdash; the count</text>
<text x="455" y="102" text-anchor="middle" font-size="11.5" fill="#17202a">argument principle:</text>
<text x="455" y="117" text-anchor="middle" font-size="11.5" fill="#17202a">&oint;&part;R &xi;&prime;/&xi; = 2&pi;i N(T)</text>
<text x="455" y="132" text-anchor="middle" font-size="11.5" fill="#17202a">N(T) = Im(I&#8323;)/&pi;</text>
<text x="455" y="147" text-anchor="middle" font-size="11.5" fill="#17202a">certified &sube; zeros, card forces =</text>
<rect x="620" y="60" width="240" height="110" rx="6" fill="#f9f6fc" stroke="#7a4e9e" stroke-width="1.6"/>
<text x="740" y="82" text-anchor="middle" font-size="13.5" fill="#7a4e9e">Route C &mdash; evaluation</text>
<text x="740" y="102" text-anchor="middle" font-size="11.5" fill="#17202a">explicit formula split into</text>
<text x="740" y="117" text-anchor="middle" font-size="11.5" fill="#17202a">computed + 3 tails</text>
<text x="740" y="132" text-anchor="middle" font-size="11.5" fill="#17202a">triangle inequality</text>
<text x="740" y="147" text-anchor="middle" font-size="11.5" fill="#17202a">residual &le; budget</text>
<text x="165" y="205" text-anchor="middle" font-size="11.5" fill="#5b6b7c">existence + uniqueness + simplicity of individual zeros</text>
<text x="455" y="205" text-anchor="middle" font-size="11.5" fill="#5b6b7c">exhaustiveness: no zero in the window is missed</text>
<text x="740" y="205" text-anchor="middle" font-size="11.5" fill="#5b6b7c">a rigorous numerical value for the formula</text>
<line x1="290" y1="115" x2="330" y2="115" stroke="#1f4e79" stroke-width="1.7" marker-end="url(#ar)"/>
<rect x="330" y="250" width="250" height="90" rx="6" fill="#eef7f1" stroke="#1e6b3a" stroke-width="1.6"/>
<text x="455" y="272" text-anchor="middle" font-size="13.5" fill="#1e6b3a">Turing window closed</text>
<text x="455" y="292" text-anchor="middle" font-size="11.5" fill="#17202a">certified = zeros in (&frac12;, T)</text>
<text x="455" y="307" text-anchor="middle" font-size="11.5" fill="#17202a">&rArr; every zero there is simple</text>
<text x="455" y="322" text-anchor="middle" font-size="11.5" fill="#17202a">and on the critical line</text>
<line x1="455" y1="170" x2="455" y2="250" stroke="#1f4e79" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="455" y="204" text-anchor="middle" font-size="11" fill="#1f4e79">cardinality squeeze</text>
<rect x="40" y="250" width="250" height="90" rx="6" fill="#fdf6f6" stroke="#8a1c1c" stroke-width="1.6"/>
<text x="165" y="272" text-anchor="middle" font-size="13.5" fill="#8a1c1c">not a proof of RH</text>
<text x="165" y="292" text-anchor="middle" font-size="11.5" fill="#17202a">it certifies a finite window</text>
<text x="165" y="307" text-anchor="middle" font-size="11.5" fill="#17202a">no claim about all zeros</text>
<line x1="165" y1="170" x2="165" y2="250" stroke="#8a1c1c" stroke-width="1.7" marker-end="url(#ar)"/>
<text x="740" y="270" text-anchor="middle" font-size="11.5" fill="#5b6b7c">Route C needs the zero list</text>
<text x="740" y="288" text-anchor="middle" font-size="11.5" fill="#5b6b7c">of Routes A/B as input</text>
<line x1="620" y1="115" x2="620" y2="250" stroke="#7a4e9e" stroke-width="1.7" marker-end="url(#ar)"/>
<path d="M620,295 L700,295" stroke="#7a4e9e" stroke-width="1.7" fill="none" marker-end="url(#ar)"/>
</svg>